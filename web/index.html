<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="hud-version" content="__HUD_VERSION__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-title" content="AI HUD">
<link rel="manifest" href="/manifest.json">
<!-- Ícone do atalho na Tela de Início: o iOS escolhe o tamanho do aparelho (iPad mini 1 = 76) -->
<link rel="apple-touch-icon" sizes="76x76" href="/icon-76.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>AI HUD</title>
<!-- ES5 e flexbox sem gap: precisa rodar no Safari 9 (iPad mini 1, iOS 9.3.5) -->
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <div class="top row">
    <h1><svg class="logo" viewBox="96 150 320 228" aria-hidden="true">
      <rect x="96" y="150" width="320" height="56" rx="28" fill="#2c2c29"/><rect x="96" y="150" width="230" height="56" rx="28" fill="#e08a66"/>
      <rect x="96" y="236" width="320" height="56" rx="28" fill="#2c2c29"/><rect x="96" y="236" width="140" height="56" rx="28" fill="#5fb8a4"/>
      <rect x="96" y="322" width="320" height="56" rx="28" fill="#2c2c29"/><rect x="96" y="322" width="80" height="56" rx="28" fill="#b39ddb"/>
    </svg>AI HUD</h1><span class="clock" id="clock"></span>
    <span class="status muted" id="status">carregando…</span>
    <div class="top-actions row" role="group" aria-label="Ações do HUD">
    <button class="btn new-btn" id="openNew" aria-label="Nova sessão" title="Nova sessão"><span class="lbl"> Nova</span></button>
    <button class="btn" id="openStats" aria-label="Estatísticas"><span class="lbl"> Estatísticas</span></button>
    <button class="btn" id="openRecent" aria-label="Recentes"><span class="lbl"> Recentes</span></button>
    <button class="btn" id="sound" aria-label="Som dos alertas"></button>
    <button class="btn" id="reading" aria-label="Ajustar tamanho da leitura" title="Tamanho da leitura" aria-expanded="false"></button>
    <button class="btn" id="refresh" aria-label="Atualizar cotas" title="Atualizar cotas"></button>
    </div>
  </div>
  <div id="readingOptions" class="reading-options" style="display:none" role="group" aria-label="Tamanho da leitura">
    <span>Leitura</span>
    <button class="btn" id="textNormal" aria-pressed="true">Normal</button>
    <button class="btn" id="textLarge" aria-pressed="false">Grande</button>
    <button class="btn" id="textLarger" aria-pressed="false">Maior</button>
  </div>
  <div id="updateNotice" class="update-notice" style="display:none" role="status">
    <span>Nova versão do AI HUD disponível.</span>
    <button class="btn" id="applyUpdate">Atualizar app</button>
  </div>
  <p id="connectionInfo" class="connection-info" aria-live="polite">Aguardando a primeira atualização…</p>
  <div class="quotas">
    <div class="panel" id="q-claude" role="button" tabindex="0" aria-label="Uso do Claude">
      <div class="qhead row"><span class="dot c0"></span><span class="name">Claude</span><span class="grow"></span><span class="sk sk-pill" style="width:4em"></span><span class="chev">›</span></div>
      <div class="gauge"><div class="row"><span class="lbl">5h</span><div class="track grow"><div class="sk" style="width:45%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:4.5em;height:.85em"></span></div></div>
      <div class="gauge"><div class="row"><span class="lbl">7d</span><div class="track grow"><div class="sk" style="width:65%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:5.5em;height:.85em"></span></div></div>
    </div>
    <div class="panel" id="q-codex" role="button" tabindex="0" aria-label="Uso do Codex">
      <div class="qhead row"><span class="dot c1"></span><span class="name">Codex</span><span class="grow"></span><span class="sk sk-pill" style="width:4em"></span><span class="chev">›</span></div>
      <div class="gauge"><div class="row"><span class="lbl">5h</span><div class="track grow"><div class="sk" style="width:35%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:4.5em;height:.85em"></span></div></div>
      <div class="gauge"><div class="row"><span class="lbl">7d</span><div class="track grow"><div class="sk" style="width:55%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:5.5em;height:.85em"></span></div></div>
    </div>
    <div class="panel" id="q-gemini" role="button" tabindex="0" aria-label="Uso do Gemini">
      <div class="qhead row"><span class="dot c2"></span><span class="name">Gemini</span><span class="grow"></span><span class="sk sk-pill" style="width:4em"></span><span class="chev">›</span></div>
      <div class="gauge"><div class="row"><span class="lbl">5h</span><div class="track grow"><div class="sk" style="width:30%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:4.5em;height:.85em"></span></div></div>
      <div class="gauge"><div class="row"><span class="lbl">7d</span><div class="track grow"><div class="sk" style="width:20%;height:100%"></div></div><span class="pct"><span class="sk" style="width:1.6em;height:.85em"></span></span></div><div class="foot row"><span class="sk" style="width:5.5em;height:.85em"></span></div></div>
    </div>
    <!-- Status do Ollama, visível também enquanto o PC está sem conexão. -->
    <!-- div (não button): o navegador centraliza na vertical o conteúdo de botões -->
    <div class="panel olla" id="q-ollama" role="button" tabindex="0" aria-label="Estado do Ollama">
      <div class="qhead row"><span class="name ell grow">Ollama</span><span class="chev">›</span></div>
      <div class="ostat"><span class="sk sk-line" style="width:72%"></span><span class="sk sk-line" style="width:54%"></span><span class="sk sk-line" style="width:84%;margin-top:10px"></span></div>
    </div>
  </div>
  <div class="gtitle" id="sessTitle">Últimas sessões</div>
  <div class="grid" id="sessList" aria-busy="true">
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:55%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:45%"></span></div><span class="sk sk-line" style="width:85%;margin-top:10px"></span><span class="sk sk-line" style="width:65%"></span><div class="foot"><span class="sk" style="width:50%;height:.75em"></span></div></div></div>
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:48%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:40%"></span></div><span class="sk sk-line" style="width:78%;margin-top:10px"></span><span class="sk sk-line" style="width:60%"></span><div class="foot"><span class="sk" style="width:45%;height:.75em"></span></div></div></div>
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:58%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:48%"></span></div><span class="sk sk-line" style="width:82%;margin-top:10px"></span><span class="sk sk-line" style="width:55%"></span><div class="foot"><span class="sk" style="width:52%;height:.75em"></span></div></div></div>
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:50%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:42%"></span></div><span class="sk sk-line" style="width:80%;margin-top:10px"></span><span class="sk sk-line" style="width:62%"></span><div class="foot"><span class="sk" style="width:46%;height:.75em"></span></div></div></div>
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:60%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:38%"></span></div><span class="sk sk-line" style="width:76%;margin-top:10px"></span><span class="sk sk-line" style="width:58%"></span><div class="foot"><span class="sk" style="width:48%;height:.75em"></span></div></div></div>
    <div class="card sk-card"><div class="in"><div class="row"><span class="sk" style="width:46%;height:1em"></span><span class="grow"></span><span class="sk sk-dot"></span></div><div class="sub row"><span class="sk sk-pill" style="width:44%"></span></div><span class="sk sk-line" style="width:84%;margin-top:10px"></span><span class="sk sk-line" style="width:52%"></span><div class="foot"><span class="sk" style="width:50%;height:.75em"></span></div></div></div>
  </div>
</div>
<!-- Servidor fora do ar: cobre a página e tenta reconectar a cada 5 s -->
<div id="offline"><div class="obox">
  <div class="oicon">📡</div>
  <h2 id="offlineTitle">Sem conexão com o servidor</h2>
  <p class="muted" id="offlineMessage">Confira a rede, a conexão do Tailscale e se o AI HUD está rodando no PC.</p>
  <p class="oretry" id="oretry">Tentando reconectar…</p>
  <p class="muted osmall" id="olast"></p>
  <button class="btn" id="oretryNow">Tentar agora</button>
  <button class="btn" id="loginAgain" style="display:none">Entrar novamente</button>
</div></div>
<div id="backdrop"></div>
<div id="overlay" tabindex="-1"><div id="overlayBody"></div></div>
<!-- O servidor acrescenta a versão por conteúdo também para o Safari 9, sem service worker. -->
<script src="/app.js"></script>
</body>
</html>
