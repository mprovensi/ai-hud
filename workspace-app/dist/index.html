    <script>
      (function () {
        var done = false;
        window.__wsBootProgress = function (pct, text) {
          if (done) return;
          var p = Math.max(5, Math.min(100, Number(pct) || 22));
          var bar = document.getElementById('wsBootBar');
          var pt = document.getElementById('wsBootPct');
          var st = document.getElementById('wsBootText');
          if (bar) bar.style.width = p + '%';
          if (pt) pt.textContent = Math.round(p) + '%';
          if (st && text) st.textContent = text;
        };
        window.__wsBootDone = function () {
          if (done) return;
          done = true;
          var bar = document.getElementById('wsBootBar');
          var pt = document.getElementById('wsBootPct');
          var st = document.getElementById('wsBootText');
          if (bar) bar.style.width = '100%';
          if (pt) pt.textContent = '100%';
          if (st) st.textContent = 'Pronto!';
          var el = document.getElementById('wsSplash');
          if (el) {
            setTimeout(function () {
              el.classList.add('hide');
              setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
            }, 90);
          }
        };
        // Segurança: nunca fica preso mesmo sem resposta do servidor
        setTimeout(function () { if (!done && window.__wsBootDone) window.__wsBootDone(); }, 7000);
      })();
