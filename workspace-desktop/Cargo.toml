[package]
name = "ai-hud-desktop"
version = "0.1.0"
description = "Shell desktop nativo (Tauri 2 / WebView2) para o AI HUD + AI Workspace"
authors = ["mprovensi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
